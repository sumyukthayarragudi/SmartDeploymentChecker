apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-checker
  template:
    metadata:
      labels:
        app: smart-checker
    spec:
      containers:
        - name: smart-checker
          image: smart-checker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: smart-checker-service
spec:
  type: NodePort
  selector:
    app: smart-checker
  ports:
    - port: 5000
      targetPort: 5000
